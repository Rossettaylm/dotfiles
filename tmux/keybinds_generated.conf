# Auto-generated from which-key-config.yaml
# Do not edit — run: python3 ~/.config/tmux/scripts/gen_keybinds.py

# Prefix bindings (enter sub-modes or direct commands)
bind p switch-client -T pane_mode
bind t switch-client -T tab_mode
bind r switch-client -T resize_mode
bind m switch-client -T move_mode
bind -N "Copy (复制模式)" s copy-mode
bind o switch-client -T session_mode
bind -N "Kill session (关闭会话)" q confirm-before -p "kill session? (y/n)" kill-session
bind -N "Reload (重载配置)" R run-shell "python3 ~/.config/tmux/scripts/gen_keybinds.py" \; source-file ~/.config/tmux/tmux.conf \; run-shell "~/.config/tmux/plugins/tmux-which-key/plugin.sh.tmux" \; display "Config reloaded"

# ─── Pane mode (prefix + p) ───
bind -N "Left (左)" -T pane_mode h select-pane -L
bind -N "Down (下)" -T pane_mode j select-pane -D
bind -N "Up (上)" -T pane_mode k select-pane -U
bind -N "Right (右)" -T pane_mode l select-pane -R
bind -N "Split down (上下分割)" -T pane_mode - split-window -v -c "#{pane_current_path}"
bind -N "Split right (左右分割)" -T pane_mode / split-window -h -c "#{pane_current_path}"
bind -N "New pane (新建面板)" -T pane_mode n split-window -c "#{pane_current_path}"
bind -N "Zoom (缩放)" -T pane_mode f resize-pane -Z
bind -N "Popup (弹出终端)" -T pane_mode w popup -d "#{pane_current_path}" -w 80% -h 80% -E
bind -N "Rename (重命名)" -T pane_mode c command-prompt -I "#T" "select-pane -T '%%'"
bind -N "Next pane (下个面板)" -T pane_mode Tab select-pane -t :.+
bind -N "Layout right (布局右移)" -T pane_mode r run "~/.config/tmux/scripts/layout_builder.sh right"
bind -N "Layout left (布局左移)" -T pane_mode R run "~/.config/tmux/scripts/layout_builder.sh left"
bind -N "Layout up (布局上移)" -T pane_mode t run "~/.config/tmux/scripts/layout_builder.sh up"
bind -N "Layout down (布局下移)" -T pane_mode T run "~/.config/tmux/scripts/layout_builder.sh down"
bind -N "Toggle layout (切换布局)" -T pane_mode s run "~/.config/tmux/scripts/layout_builder.sh toggle"
bind -N "Watch cmd (监视命令)" -T pane_mode W run -b "bash ~/.config/tmux/scripts/watch_pane.sh #{pane_id} #{window_id}"
bind -N "Kill (关闭)" -T pane_mode x kill-pane

# ─── Tab mode (prefix + t) ───
bind -N "Prev (上一个)" -T tab_mode h previous-window
bind -N "Next (下一个)" -T tab_mode l next-window
bind -N "New (新建)" -T tab_mode n new-window -c "#{pane_current_path}"
bind -N "Rename (重命名)" -T tab_mode r command-prompt -I "#W" "rename-window '%%'"
bind -N "Break pane (拆成独立窗口)" -T tab_mode b if-shell "test #{window_panes} -gt 1" break-pane
bind -N "Sync panes (同步输入)" -T tab_mode s setw synchronize-panes
bind -N "Last window (上个访问窗口)" -T tab_mode Tab last-window
bind -N "Win 1 (窗口 1)" -T tab_mode 1 select-window -t 1
bind -N "Win 2 (窗口 2)" -T tab_mode 2 select-window -t 2
bind -N "Win 3 (窗口 3)" -T tab_mode 3 select-window -t 3
bind -N "Win 4 (窗口 4)" -T tab_mode 4 select-window -t 4
bind -N "Win 5 (窗口 5)" -T tab_mode 5 select-window -t 5
bind -N "Win 6 (窗口 6)" -T tab_mode 6 select-window -t 6
bind -N "Win 7 (窗口 7)" -T tab_mode 7 select-window -t 7
bind -N "Win 8 (窗口 8)" -T tab_mode 8 select-window -t 8
bind -N "Win 9 (窗口 9)" -T tab_mode 9 select-window -t 9
bind -N "Kill (关闭)" -T tab_mode x confirm-before -p "kill window #W? (y/n)" kill-window

# ─── Resize mode (prefix + r) ───
bind -N "Left (左)" -T resize_mode -r h resize-pane -L 2
bind -N "Down (下)" -T resize_mode -r j resize-pane -D 2
bind -N "Up (上)" -T resize_mode -r k resize-pane -U 2
bind -N "Right (右)" -T resize_mode -r l resize-pane -R 2
bind -N "Left ×5 (左移 5)" -T resize_mode -r H resize-pane -L 5
bind -N "Down ×5 (下移 5)" -T resize_mode -r J resize-pane -D 5
bind -N "Up ×5 (上移 5)" -T resize_mode -r K resize-pane -U 5
bind -N "Right ×5 (右移 5)" -T resize_mode -r L resize-pane -R 5

# ─── Move mode (prefix + m) ───
bind -N "Swap up (与上交换)" -T move_mode h swap-pane -U
bind -N "Swap down (与下交换)" -T move_mode j swap-pane -D
bind -N "Swap up (与上交换)" -T move_mode k swap-pane -U
bind -N "Swap down (与下交换)" -T move_mode l swap-pane -D
bind -N "Next (下一个)" -T move_mode n swap-pane -D
bind -N "Prev (上一个)" -T move_mode p swap-pane -U
bind -N "Next pane (下个面板)" -T move_mode Tab swap-pane -D

# ─── Session mode (prefix + o) ───
bind -N "Detach (分离会话)" -T session_mode d detach-client
bind -N "Choose tree (会话树)" -T session_mode w choose-tree -Zs

