# ============================================================
# tmux.conf — 基于 Zellij 快捷键配置复刻
# ============================================================
#
# 映射策略:
#   Zellij locked mode  → tmux root table (Alt 快捷键, 无需 prefix)
#   Zellij Ctrl-g 切换  → tmux prefix (Ctrl-\\)
#   Zellij sub-modes    → tmux custom key tables:
#     prefix + p → pane_mode     (面板操作)
#     prefix + t → tab_mode      (窗口/标签操作)
#     prefix + r → resize_mode   (大小调整)
#     prefix + m → move_mode     (移动面板)
#     prefix + s → copy-mode     (滚动/搜索)
#     prefix + o → session_mode  (会话管理)
#
# ============================================================


# ─── 基础设置 ──────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 0
set -g repeat-time 800
set -g focus-events on
set -g detach-on-destroy off
setw -g mode-keys vi
set -g status-keys vi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# MRU 面板追踪 (fzf pane switcher 依赖)
set-hook -g pane-focus-in "run -b 'bash ~/.config/tmux/scripts/fzf_agents.tmux update_mru_pane_ids'"


# ─── Prefix: Ctrl-\ ──────────────────────────────────────────

unbind C-b
set -g prefix C-\\
bind C-k send-prefix

# 清除残留绑定 (非来自当前配置，但 tmux 运行时可能遗留)
# 切换窗口布局: Alt + p
bind -n M-p run "~/.config/tmux/scripts/layout_builder.sh toggle"
unbind -n M-\\
# 交换两个面板位置: Alt + ,
bind -n M-, run "~/.config/tmux/scripts/layout_builder.sh swap"

# ============================================================
# 全局 Alt 快捷键 (无需 prefix, 对应 zellij locked 模式)
# ============================================================

# 面板导航: Alt + h/j/k/l  |  Alt + 方向键
bind -N "focus left (聚焦左侧)" -n M-h select-pane -L
bind -N "focus down (聚焦下方)" -n M-j select-pane -D
bind -N "focus up (聚焦上方)" -n M-k select-pane -U
bind -N "focus right (聚焦右侧)" -n M-l select-pane -R
bind -N "focus left (聚焦左侧)" -n M-Left  select-pane -L
bind -N "focus down (聚焦下方)" -n M-Down  select-pane -D
bind -N "focus up (聚焦上方)" -n M-Up    select-pane -U
bind -N "focus right (聚焦右侧)" -n M-Right select-pane -R

# 面板大小调整: Alt + Shift + h/j/k/l  |  Alt + Shift + 方向键
bind -N "resize left (左边界左移 2)" -n M-H resize-pane -L 2
bind -N "resize down (下边界下移 2)" -n M-J resize-pane -D 2
bind -N "resize up (上边界上移 2)" -n M-K resize-pane -U 2
bind -N "resize right (右边界右移 2)" -n M-L resize-pane -R 2
bind -N "resize left (左边界左移 2)" -n M-S-Left  resize-pane -L 2
bind -N "resize down (下边界下移 2)" -n M-S-Down  resize-pane -D 2
bind -N "resize up (上边界上移 2)" -n M-S-Up    resize-pane -U 2
bind -N "resize right (右边界右移 2)" -n M-S-Right resize-pane -R 2


# ─── Alt + Shift 的 CSI-u 别名 ────────────────────────────────
# `extended-keys always` 生效时，ghostty 对 Shift 组合发 kitty/CSI-u 编码
# （opt+shift+h -> ESC[72;4u），code 是「按了 shift 的那个字符」；tmux 把它规范化
# 成 M-S-*，而 M-<大写> 只在旧式 ESC 编码下才匹配，所以上一条的 Alt+Shift 绑定
# 会全部失效。逐键实测（隔离 tmux server，见 documents/ 相关笔记）:
#   opt+shift+h -> ESC[72;4u  -> M-S-H      opt+shift+← -> ESC[1;4D -> M-S-Left
#   opt+shift+r -> ESC[82;4u  -> M-S-R      方向键不受影响，M-S-Left 本来就对
#   opt+shift+? -> ESC[63;4u  -> M-S-?
#   opt+shift+1 -> ESC[49;4u  -> M-S-1
# 字母键的码点大小写（h+shift vs H+shift）取决于终端如何算 layout key，故两种
# 拼写都绑，只会命中一个。用 `cat -v` 抓真实字节后可以删掉不生效的那半:
#   tmux -L probe -f /dev/null new -d -s p 'cat -v'
#   tmux -L probe set -g extended-keys always ; tmux -L probe attach -t p

bind -N "resize left (左边界左移 2)" -n M-S-h resize-pane -L 2
bind -N "resize left (左边界左移 2)" -n M-S-H resize-pane -L 2
bind -N "resize down (下边界下移 2)" -n M-S-j resize-pane -D 2
bind -N "resize down (下边界下移 2)" -n M-S-J resize-pane -D 2
bind -N "resize up (上边界上移 2)" -n M-S-k resize-pane -U 2
bind -N "resize up (上边界上移 2)" -n M-S-K resize-pane -U 2
bind -N "resize right (右边界右移 2)" -n M-S-l resize-pane -R 2
bind -N "resize right (右边界右移 2)" -n M-S-L resize-pane -R 2

bind -N "reload config (重载 tmux 配置)" -n M-S-R source-file ~/.config/tmux/tmux.conf
bind -N "key hints (键位速查表)" -n M-S-? run-shell -b "python3 ~/.config/tmux/scripts/keyhint.py"

bind -N "move pane to win 1 (移到窗口 1)" -n M-S-1 run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 1"
bind -N "move pane to win 2 (移到窗口 2)" -n M-S-2 run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 2"
bind -N "move pane to win 3 (移到窗口 3)" -n M-S-3 run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 3"
bind -N "move pane to win 4 (移到窗口 4)" -n M-S-4 run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 4"
bind -N "move pane to win 5 (移到窗口 5)" -n M-S-5 run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 5"
bind -N "move pane to win 6 (移到窗口 6)" -n M-S-6 run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 6"

# Zoom: Alt + = (放大/还原)
bind -N "zoom toggle (放大 / 还原)" -n M-= resize-pane -Z

# 窗口切换: Alt + 9/0 (M-[ 与 CSI 引导序列冲突，会导致 yazi 等终端程序的 DSR 响应被截获)
bind -N "previous window (上一个窗口)" -n M-9 previous-window
bind -N "next window (下一个窗口)" -n M-0 next-window

# 新建窗口: Alt + t (对应 zellij NewTab)
bind -N "new window (新建窗口)" -n M-t new-window -c "#{pane_current_path}"

# 面板分割: Alt + / (左右) / Alt + - (上下)
bind -N "split right (左右分割)" -n M-/ split-window -h -c "#{pane_current_path}"
bind -N "split down (上下分割)" -n M-- split-window -v -c "#{pane_current_path}"

# 当前面板拆成新窗口: Alt + b (单 pane 的窗口直接跳过，避免空窗口残留)
bind -N "break pane (当前面板拆成新窗口)" -n M-b if-shell -F '#{>:#{window_panes},1}' 'break-pane' ''

# Detach: Alt + d
bind -N "detach (分离当前会话)" -n M-d detach-client

# 重命名窗口: Alt + r (对应 zellij renametab)
bind -N "rename window (重命名当前窗口)" -n M-r command-prompt -I "#W" "rename-window '%%'"

# 重载配置: Alt + Shift + R (等同 which-key 菜单里的 Reload config)
bind -N "reload config (重载 tmux 配置)" -n M-R source-file ~/.config/tmux/tmux.conf

# 键位速查表: Alt + ? (fzf 弹窗, 内容来自 list-keys -N 与 which-key-config.yaml)
bind -N "key hints (键位速查表)" -n M-? run-shell -b "python3 ~/.config/tmux/scripts/keyhint.py"

# 跳转窗口: Alt + 1-6 (对应 zellij GoToTab)
bind -N "goto window 1 (跳到窗口 1)" -n M-1 select-window -t 1
bind -N "goto window 2 (跳到窗口 2)" -n M-2 select-window -t 2
bind -N "goto window 3 (跳到窗口 3)" -n M-3 select-window -t 3
bind -N "goto window 4 (跳到窗口 4)" -n M-4 select-window -t 4
bind -N "goto window 5 (跳到窗口 5)" -n M-5 select-window -t 5
bind -N "goto window 6 (跳到窗口 6)" -n M-6 select-window -t 6

# 移动面板到指定窗口: Alt + Shift + 1-6 (join-pane, 窗口不存在则自动创建)
bind -N "move pane to win 1 (移到窗口 1)" -n M-! run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 1"
bind -N "move pane to win 2 (移到窗口 2)" -n M-@ run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 2"
bind -N "move pane to win 3 (移到窗口 3)" -n 'M-#' run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 3"
bind -N "move pane to win 4 (移到窗口 4)" -n 'M-$' run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 4"
bind -N "move pane to win 5 (移到窗口 5)" -n M-% run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 5"
bind -N "move pane to win 6 (移到窗口 6)" -n M-^ run-shell "bash ~/.config/tmux/scripts/join_pane_to_window.sh 6"

# 移动窗口顺序: Alt + i / o (对应 zellij MoveTab)
bind -N "move window left (窗口前移一位)" -n M-i { swap-window -t -1; select-window -t -1 }
bind -N "move window right (窗口后移一位)" -n M-o { swap-window -t +1; select-window -t +1 }

# 面板切换: Alt + e (fzf pane switcher, MRU 排序)
# 必须用 run-shell -b: 不带 -b 时 run-shell 返回 CMD_RETURN_WAIT，会把整个 client
# 的命令队列挂起直到 popup 退出，期间所有按键只被缓冲、不进 pane，表现为「卡死」。
bind -N "pane switcher (fzf, MRU)" -n M-e run-shell -b "bash ~/.config/tmux/scripts/fzf_agents.tmux do_action"

# 会话管理: Alt + w (fzf session manager)
bind -N "session manager (fzf)" -n M-w run-shell -b "bash ~/.config/tmux/scripts/fzf_sessions.tmux do_action"

# 浮动弹窗: Alt + f (toggle, 需要 tmux 3.3+)
# scratch 单独 detach-on-destroy on。全局是 off，会话销毁时 client 会改挂到最近的
# 其它会话；popup -E 只在命令进程退出时关闭，于是 exit 掉最后一个 pane 后浮层不关，
# 反而嵌套显示原来的窗口。\\; 让 shell 把分号交给 tmux，set 在 attach 时就执行。
bind -N "scratch terminal (浮动 scratch 终端)"  -n M-f if-shell -F '#{==:#{session_name},scratch}' { detach-client } { display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s scratch \\; set-option -t scratch detach-on-destroy on" }

# Agent Radar: Alt + n 跳到最该处理的 agent, Alt + a 底部 dialog
bind -N "next agent (跳到最该处理的 agent)" -n M-n run-shell "python3 ~/.config/tmux/scripts/agent_nav.py jump_next"
bind -N "agent list (Agent 列表 dialog)"  -n M-a run-shell "python3 ~/.config/tmux/scripts/agent_nav.py menu"

# ============================================================
# Prefix 子模式 (自动生成，来源: which-key-config.yaml)
# 运行 python3 ~/.config/tmux/scripts/gen_keybinds.py 重新生成
# ============================================================

source-file ~/.config/tmux/keybinds_generated.conf

# ─── Copy/Scroll 模式 (vi 定制，不在 yaml 中管理) ───────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel


# ─── TPM 插件 ─────────────────────────────────────────────────

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ─── Catppuccin 主题配置 ─────────────────────────────────────

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_status_background 'none'

# ─── Pane Border ─────────────────────────────────────────────

set -g pane-border-lines double
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa,bold"
set -g pane-border-indicators arrows
setw -g pane-border-status top
setw -g pane-border-format '#{?pane_active, #[fg=#1e1e2e]#[bg=#89b4fa]#[bold] #{pane_index}: #{pane_current_command} #[fg=#89b4fa]#[bg=default]#[default] #[fg=#a6adc8]#{=40:pane_current_path} , #[fg=#1e1e2e]#[bg=#6c7086] #{pane_index}: #{pane_current_command} #[fg=#6c7086]#[bg=default]#[default] #[fg=#585b70]#{=40:pane_current_path} }'

# 非活跃面板前景灰化，突出当前面板。
# 注意 tmux 只把 window-style 的 fg/bg 应用到「默认色」单元格（见 tty.c 的
# tty_default_colours，仅覆盖 fg/bg == 8 的格子），程序自绘前景色不受影响。
# 活跃面板必须写具体色值：fg=default 会被规范化成 fg=8，反而回退去用
# window-style，导致聚焦面板也被灰化。
set -g window-style 'fg=#585b70'
set -g window-active-style 'fg=#cdd6f4'

set -g status-position bottom


# ─── Resurrect + Continuum ────────────────────────────────────

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


# ─── Status Bar (catppuccin modules) ──────────────────────────

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-left-length 50
set -g status-right-length 160
set -g status-right "#{E:@agent_toast}#{E:@agent_summary}#(python3 ~/.config/tmux/scripts/llm_balance_status.py)#{E:@llm_balance}#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %H:%M"

# ─── Agent Radar: tab 角标 (必须在 run tpm 之前) ──────────────

set -g @catppuccin_window_text " #T#{?#{m:*|#{window_id}|*,#{@agent_blocked_windows}}, ,#{?#{m:*|#{window_id}|*,#{@agent_unread_windows}}, ,}}"
set -g @catppuccin_window_current_text " #T#{?#{m:*|#{window_id}|*,#{@agent_blocked_windows}}, ,#{?#{m:*|#{window_id}|*,#{@agent_unread_windows}}, ,}}"

# ─── TPM 初始化 (保持在文件最末尾) ────────────────────────────

run '~/.config/thirdparty/tpm/tpm'

# 兼容 Cursor CLI / pi agent：无条件转发 CSI-u（Shift+Enter → \x1b[13;2u）
# on 只在应用主动申请时转发；Cursor CLI 通常不会申请，必须用 always
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'
set -as terminal-features 'xterm*:extkeys'

# xterm-ghostty 的 terminfo 无 Hls/osc7，tmux 3.6 也没有内置 ghostty 条目，
# 不显式声明会导致 OSC 8 超链接被剥成纯文本、OSC 7 cwd 不上报
set -as terminal-features 'xterm-ghostty:hyperlinks:clipboard:osc7:title:RGB:sync:usstyle'
set -g allow-passthrough on

# ─── Agent Radar daemon ──────────────────────────────────────
# 单例由 @agent_radar_pid 保证，重复 attach 不会起第二个实例。
# 停止: tmux set -gu @agent_radar_pid    重启: agentd.py restart

set-hook -g client-attached "run -b 'python3 ~/.config/tmux/scripts/agentd.py'"
